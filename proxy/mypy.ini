# The proxy's type check, run from proxy/ as `mypy` (CONTRIBUTING.md).
#
# `files` is the allowlist: only these packages are checked, and the list only
# grows. Everything they import is still analysed for its types
# (follow_imports = silent) without its own errors being reported, so a
# package joins the list once its own errors are fixed. auth and storage carry
# every strict flag that had no finding when they joined; the four
# annotation-completeness flags (disallow_untyped_defs,
# disallow_incomplete_defs, warn_return_any, disallow_any_generics) are the
# next steps, one package at a time.
[mypy]
python_version = 3.13
files =
    auth,
    storage,
    api/checks,
    api/internal,
    api/notifications,
    services/departments,
    services/memory,
    services/scripts,
    services/sharing,
explicit_package_bases = True
follow_imports = silent
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
cache_dir = .mypy_cache

[mypy-auth.*,storage.*]
check_untyped_defs = True
strict_equality = True
warn_unused_ignores = True
no_implicit_reexport = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
extra_checks = True

