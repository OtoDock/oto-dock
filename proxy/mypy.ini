# The proxy's type check, run from proxy/ as `mypy` (CONTRIBUTING.md).
#
# The whole proxy is checked at mypy's default level: `files = .`, with the
# tests and the virtualenv excluded, so a new module is checked from its
# first commit. What a checked module imports from outside that set is
# analysed for its types (follow_imports = silent) without its own errors
# being reported. auth and storage carry every strict flag that had no
# finding when they joined, and so do the modules that left storage for a
# higher layer; the four annotation-completeness flags
# (disallow_untyped_defs, disallow_incomplete_defs, warn_return_any,
# disallow_any_generics) are the next steps, one package at a time.
[mypy]
python_version = 3.13
files = .
exclude = ^(tests|venv)/
explicit_package_bases = True
follow_imports = silent
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
cache_dir = .mypy_cache

[mypy-auth.*,storage.*,services.agents.agent_provisioning,services.community.community_agent_template_store,services.community.template_sig,services.remote.remote_status]
check_untyped_defs = True
strict_equality = True
warn_unused_ignores = True
no_implicit_reexport = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
extra_checks = True
