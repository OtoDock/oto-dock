# OtoDock — build-from-source overlay (contributors / development).
#
# Stack this on top of the base file to build the images from this repo
# instead of pulling the GHCR releases:
#
#   scripts/compose.sh up -d --build
#   (= docker compose -f docker-compose.yml -f docker-compose.build.yml …,
#    with PYTHON_IMAGE / NODE_IMAGE / POSTGRES_IMAGE sourced from VERSIONS.md
#    by scripts/versions.sh so the build stays in lockstep with the pins.)
#
# The base docker-compose.yml stays pull-only so a downloaded copy works
# standalone; every build context lives here. Build args left unset fall back
# to the Dockerfile ARG defaults (a bare `docker compose -f docker-compose.yml
# -f docker-compose.build.yml up -d --build` works on the baked pins).

services:
  otodock-proxy:
    # Never pull the GHCR tag in the source flow — always build (a fresh
    # machine has no local image and the GHCR release may not exist or may
    # not match this tree).
    pull_policy: build
    build:
      context: .
      dockerfile: proxy/Dockerfile
      args:
        - PYTHON_IMAGE
        - NODE_IMAGE
        - OTODOCK_VERSION
    environment:
      # A build of this tree is not the published image of its version: a
      # compute machine on another server then runs the image
      # OTODOCK_REMOTE_COMPUTE_IMAGE names.
      OTODOCK_PROXY_IMAGE: ""

  # Runs on the image the proxy service just built. Never pulled: without
  # this, Compose first tries the GHCR proxy tag for it, which a fresh source
  # install may not find and should never take. No build of its own: a second
  # build of the same image is cached but still exported and unpacked again,
  # the whole image on a first build. Compose builds before it creates any
  # container, so the image is there by the time this one-shot runs.
  otodock-agents-init:
    pull_policy: never

  # The tools' hand-over to the compute service: the same image, never pulled.
  otodock-tools-copy:
    pull_policy: never

  # The compute service runs the same image, never pulled either.
  otodock-compute:
    pull_policy: never

  file-tools:
    pull_policy: build
    build:
      context: ./mcps/custom/file-tools-mcp
      args:
        - PYTHON_IMAGE
        - OTODOCK_VERSION
