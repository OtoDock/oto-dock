# The GPS bridge of the mobile app, staged out of the public cut with it: the
# repository's policy and baseline (../../../ruff.toml) plus the baseline
# entries of the files here, kept in this tree so the public files never name
# it (ruff reads the nearest config).
extend = "../../../ruff.toml"

# GENERATED by ruff_baseline.py --write: do not edit.
# The files that already had findings of a rule when ruff.toml adopted it,
# and those rules. A new finding anywhere else fails `ruff check`; fixed
# entries are dropped by the next --write (`--check` lists them).

[lint.extend-per-file-ignores]
