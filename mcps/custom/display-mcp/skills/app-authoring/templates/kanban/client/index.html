<script src="/ui-kit/tailwind.js"></script>
<div class="px-1 py-2">
  <div class="mb-3 flex flex-wrap items-center gap-2">
    <!-- No <form>: the frame is sandboxed without allow-forms, so a form
         submit is blocked before any script runs. Enter and the button are
         handled in script instead. Hidden until the server says this
         viewer may change the board. -->
    <div id="add" class="flex flex-1 gap-2" hidden>
      <input id="title" class="flex-1" placeholder="New card" aria-label="New card title" maxlength="200">
      <button class="btn primary" type="button" id="add-btn">Add</button>
    </div>
    <span id="status" class="text-xs text-[var(--p-text-secondary)]" role="status">Connecting…</span>
  </div>
  <p id="read-only" class="mb-3 text-sm text-[var(--p-text-secondary)]" hidden>You can look at this board. Members who can edit it move the cards.</p>
  <div id="board" class="grid grid-cols-1 gap-3 md:grid-cols-3"></div>
</div>
<script>
(function () {
  var COLUMNS = [["todo", "To do"], ["doing", "Doing"], ["done", "Done"]];
  var board = document.getElementById("board");
  var status = document.getElementById("status");
  var cards = [];
  var canWrite = false;

  function inColumn(col) { return cards.filter(function (k) { return k.col === col; }); }

  function render() {
    // A redraw replaces every element: the card whose picker had the focus
    // gets it back, so a keyboard move keeps the person's place.
    var active = document.activeElement;
    var focused = active && active.dataset ? active.dataset.card || "" : "";
    board.replaceChildren();
    COLUMNS.forEach(function (c) {
      var col = document.createElement("section");
      col.className = "card min-h-40 p-2";
      col.dataset.col = c[0];
      var h = document.createElement("h3");
      h.className = "mb-2 text-sm font-semibold";
      h.textContent = c[1] + " · " + inColumn(c[0]).length;
      col.appendChild(h);
      inColumn(c[0]).forEach(function (k) {
        var el = document.createElement("div");
        el.className = "mb-2 rounded-[var(--p-radius-sm)] border border-[var(--p-border-light)] bg-[var(--p-surface-raised)] p-2 text-sm" + (canWrite ? " cursor-grab" : "");
        el.draggable = canWrite;
        el.dataset.id = k.id;
        el.innerHTML = '<div class="font-medium break-words"></div><div class="mt-1 text-xs text-[var(--p-text-light)]"></div>';
        el.firstChild.textContent = k.title;
        el.lastChild.textContent = k.moved_by ? "Moved by " + k.moved_by : "Not moved yet";
        if (canWrite) {
          el.addEventListener("dragstart", function (e) { e.dataTransfer.setData("text/plain", String(k.id)); });
          var row = document.createElement("div");
          row.className = "mt-2 flex flex-wrap items-center gap-2";
          // The column picker moves a card by keyboard and on a phone,
          // where dragging does not work.
          var pick = document.createElement("select");
          pick.setAttribute("aria-label", "Column for " + k.title);
          pick.dataset.card = String(k.id);
          pick.className = "text-xs";
          COLUMNS.forEach(function (c2) {
            var o = document.createElement("option");
            o.value = c2[0]; o.textContent = c2[1]; o.selected = c2[0] === k.col;
            pick.appendChild(o);
          });
          pick.addEventListener("change", function () { move(k.id, pick.value); });
          var del = document.createElement("button");
          del.type = "button";
          del.className = "btn quiet-danger";
          del.textContent = "Remove";
          del.onclick = function () { api("/cards/" + k.id, { method: "DELETE" }); };
          row.append(pick, del);
          el.appendChild(row);
        }
        col.appendChild(el);
      });
      if (canWrite) {
        col.addEventListener("dragover", function (e) { e.preventDefault(); });
        col.addEventListener("drop", function (e) {
          e.preventDefault();
          var id = e.dataTransfer.getData("text/plain");
          if (id) move(id, c[0]);
        });
      }
      board.appendChild(col);
    });
    if (focused) {
      var again = board.querySelector('select[data-card="' + focused + '"]');
      if (again) again.focus();
    }
  }

  function move(id, col) {
    api("/cards/" + id + "/move", { method: "POST", body: JSON.stringify({ col: col, position: inColumn(col).length + 1 }) });
  }

  function api(path, init) {
    init = init || {};
    init.headers = Object.assign({ "content-type": "application/json" }, init.headers || {});
    return otodock.fetch(path, init).then(function (r) {
      if (r.status === 403) status.textContent = "You can look at this board but not change it.";
      else if (!r.ok) status.textContent = "That did not save. Try again.";
      return r;
    }).catch(function () { status.textContent = "No connection right now. Your change was not saved."; });
  }

  function addCard() {
    var input = document.getElementById("title");
    var title = input.value.trim();
    if (!title) return;
    input.value = "";
    api("/cards", { method: "POST", body: JSON.stringify({ title: title, col: "todo" }) });
  }
  document.getElementById("add-btn").addEventListener("click", addCard);
  document.getElementById("title").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addCard(); }
  });

  // Live: the server pushes the whole board on every change.
  var ws = otodock.ws("/live");
  ws.onopen = function () { status.textContent = "Live"; };
  ws.onclose = function () { status.textContent = "Reconnecting…"; };
  ws.onmessage = function (ev) {
    try {
      var msg = JSON.parse(ev.data);
      if (msg.type === "cards") { cards = msg.cards || []; render(); }
    } catch (err) {}
  };
  // The server says who may change the board: the page hides the rest, and
  // the server refuses it again whatever the page shows.
  api("/cards").then(function (r) { return r && r.ok ? r.json() : null; }).then(function (d) {
    if (!d) return;
    canWrite = !!d.can_write;
    document.getElementById("add").hidden = !canWrite;
    document.getElementById("read-only").hidden = canWrite;
    cards = d.cards || [];
    render();
  });
  render();
})();
</script>
