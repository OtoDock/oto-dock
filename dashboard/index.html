<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <!-- The fonts (Manrope, Comfortaa, JetBrains Mono) are self-hosted through
         @fontsource imports in src/index.css: no CDN request, safe on an
         air-gapped install. xterm falls back to a system mono stack if the mono
         font fails; it draws box-drawing glyphs itself. -->
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <title>OtoDock Dashboard</title>
    <meta name="theme-color" content="#faf9f9" />
    <!-- The boot screen: the field the app's system splash fades onto, the
         page colour on the web, the mark centred where the splash draws its
         icon (the app pushes the bar heights as two variables, since the
         viewport sits between the bars). boot.js sets data-boot before the
         first paint; a page without it shows nothing. The colours are the
         design tokens' values, held by a test. -->
    <style>
      #boot { display: none; }
      html[data-boot] #boot {
        display: block; position: fixed; inset: 0; z-index: 1000; overflow: hidden;
        background: var(--boot-bg);
        --boot-cy: calc(50% + (var(--oto-bar-bottom, 0px) - var(--oto-bar-top, 0px)) / 2);
        --boot-mark: 96px;
      }
      html[data-boot="app"] { --boot-bg: linear-gradient(#1d4f80, #174067); --boot-ink: #ffffff; --boot-light: #fdf6e3; }
      html[data-boot="app"] #boot { --boot-mark: 127px; }
      html[data-boot="web"] { --boot-bg: #faf9f9; --boot-ink: #1d4f80; --boot-light: #fdf6e3; }
      html[data-boot="web"].dark { --boot-bg: #0d1117; --boot-ink: #ffffff; --boot-light: #fdf6e3; }
      #boot .boot-mark {
        position: absolute; left: 50%; top: var(--boot-cy);
        width: calc(var(--boot-mark) * 96 / 88); height: calc(var(--boot-mark) * 96 / 88);
        transform: translate(-50%, -50%);
      }
      #boot .boot-word {
        position: absolute; left: 50%; top: calc(var(--boot-cy) + var(--boot-mark) * 0.7);
        width: calc(var(--boot-mark) * 1.167); transform: translateX(-50%);
      }
      html[data-boot="web"] #boot .boot-word { display: none; }
      #boot .boot-ink { fill: var(--boot-ink); }
      #boot .boot-glow stop { stop-color: var(--boot-light); }
      /* A rim of light runs once around the mark's edge (the orbit, masked to
         the outline's stroke) and rests at the upper left, a glass reflection.
         The light is a candle white (amber.100): warm against the blue field
         and the ink page, a glint on the blue mark of the light page. */
      #boot .boot-orbit {
        transform-origin: 48px 56px; transform: rotate(315deg); opacity: 0;
        animation: boot-orbit 1100ms cubic-bezier(0.2, 0, 0, 1) both paused;
      }
      html.boot-shown #boot .boot-orbit { animation-play-state: running; }
      @keyframes boot-orbit {
        0% { transform: rotate(315deg); opacity: 0; }
        15% { opacity: 1; }
        60% { opacity: 1; }
        100% { transform: rotate(675deg); opacity: 0.4; }
      }
      #boot.is-done { opacity: 0; pointer-events: none; transition: opacity 200ms cubic-bezier(0.3, 0, 1, 1); }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-orbit { animation: none; transform: rotate(315deg); opacity: 0.4; }
        #boot.is-done { transition: none; }
      }
    </style>
    <script src="/boot.js"></script>
  </head>
