# Repo-wide lint gate: import hygiene, dead/no-effect code, async and
# exception hygiene, complexity. Not a format gate.
target-version = "py310" # satellite's floor; proxy/phone/audio run 3.13

# The frozen baseline: the (file, rule) pairs that already had findings when
# a rule was adopted, as generated per-file ignores. A rule's NEW findings
# fail; the old ones are paid down and the file shrinks. The maintainers
# regenerate it from a clean checkout of a commit, never by hand and never
# with `ruff --add-noqa` (CONTRIBUTING.md).
extend = "ruff-baseline.toml"

# .gitignore already hides venvs, node_modules, and runtime trees from ruff;
# these cover checkouts where ignored trees exist without the ignore rules.
extend-exclude = [
    "mcps/.uv-python",
    "mcps/community",
    # Vendored skill content (Anthropic skill-creator scripts) — shipped for
    # agents to run, not platform code; upstream style stays untouched.
    "mcps/custom/mcps-mcp/skills",
]

# First-party roots for the import sorter: the proxy and the phone service
# import their own packages by their top-level names (named, not ".", so a
# gitignored directory at the root never counts as first-party on one machine);
# each custom MCP server imports its sibling modules by their bare names.
src = ["proxy", "phone", "mcps/custom/*"]

[lint]
select = [
    "F401",    # unused import
    "F821",    # undefined name (a missing import only a live path would hit)
    "F403",    # star import
    "F405",    # possibly-undefined name via star import
    "F811",    # redefinition / duplicate import
    "F841",    # unused local variable
    "B",       # bugbear: likely bugs and design problems
    "E722",    # bare except
    "SIM105",  # try/except/pass -> contextlib.suppress
    "PLW0108", # lambda that only forwards its arguments to a callable
    "ASYNC",   # blocking calls and busy waits inside coroutines
    "BLE",     # blind `except Exception`
    "RUF006",  # a task whose reference is dropped (see proxy/core/background.py)
    "G",       # logging calls that format eagerly
    "LOG",     # logging misuse
    "C901",    # function complexity, above max-complexity below
    "I",       # import order
    "UP",      # syntax the target version has a newer form for
    "RUF100",  # a noqa marker nothing needs any more
]

[lint.isort]
known-first-party = ["satellite"]
# One statement per module: `from x import a as b, c as d` stays one line.
combine-as-imports = true

[lint.mccabe]
max-complexity = 40

[lint.flake8-bugbear]
# FastAPI's dependency markers are meant to sit in argument defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[lint.per-file-ignores]
# ExceptionGroup and BaseExceptionGroup are 3.11 builtins; the proxy runs 3.13
# while the target stays at the satellite's floor.
"proxy/app.py" = ["F821"]
"proxy/middleware.py" = ["F821"]
"proxy/tests/api/test_http_middleware.py" = ["F821"]
# pytest fixture re-import: the module-level import IS the fixture
# registration; test parameters legitimately shadow it.
"proxy/tests/mcp/test_builder_blocks.py" = ["F811"]
