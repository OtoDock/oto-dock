name: ci

# The public test gates: the proxy pytest suite against a disposable Postgres
# service container, the audio package's own suite (NOT collected by the
# proxy run — its testpaths live in audio/pyproject.toml), plus the dashboard
# typecheck / build / vitest. Same commands as a local run — see
# proxy/tests/README.md ("CI" section). Then the quick checks of the maintainers' release gate, with the
# same tools and severities: gitleaks, hadolint, actionlint, reuse, pip-audit
# and, on a pull request, the dependency review.
#
# Branch protection on main requires `proxy`, `dashboard`, `satellite` and
# `phone`; every other job here reports without blocking a merge. The
# dashboard's ESLint gate and the proxy's mypy allowlist run in their own jobs
# (`dashboard-lint`, `typecheck`) for that reason.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A force-push to a PR branch cancels the now-stale run; pushes to main
# always run to completion (their results guard the release flow).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proxy:
    if: github.repository == 'OtoDock/oto-dock'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: otodock
          POSTGRES_PASSWORD: otodock
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U otodock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            proxy/requirements.txt
            proxy/requirements-test.txt
            audio/pyproject.toml

      - name: ruff
        # The import and dead-code rules this required check has always held;
        # the rest of ruff.toml's policy (and its baseline) runs in the `lint`
        # job, which reports without blocking a merge.
        run: |
          python -m pip install -q "ruff==0.15.22"
          ruff check --select F401,F821,F403,F405,F811,F841,B018,E722,SIM105,PLW0108 .

      - name: System tools used by the suite
        # The sysctl re-allows unprivileged user namespaces (Ubuntu 24.04
        # runners restrict them via AppArmor), which the sandbox
        # network-isolation integration tests need for pasta/bwrap.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap passt iproute2 ripgrep
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install proxy dependencies
        # cwd = repo root: the local audio package is a path dependency. The
        # localmodels extra (onnxruntime, transformers) lets the audio suite
        # run the bundled VAD and turn models instead of skipping them.
        run: |
          python -m pip install -U pip
          python -m pip install "./audio[localmodels]"
          python -m pip install -r proxy/requirements.txt -r proxy/requirements-test.txt

      - name: pytest
        working-directory: proxy
        env:
          TEST_DATABASE_URL: postgresql://otodock:otodock@localhost:5432/otodock_test
        run: python -m pytest -n 8 -q

      - name: pytest (audio package)
        # Colocated per-subpackage tests (providers/*/tests, streaming/tests)
        # discovered via audio/pyproject.toml testpaths.
        working-directory: audio
        run: python -m pytest -q

  # The same suites on arm64: the release images publish for both
  # architectures, and the sandbox (bwrap + pasta namespaces) and the ONNX
  # models are the parts a build alone does not prove. Not a required check.
  # Same steps as `proxy` on a GitHub-hosted arm64 runner (free for public
  # repositories).
  proxy-arm64:
    if: github.repository == 'OtoDock/oto-dock'
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: otodock
          POSTGRES_PASSWORD: otodock
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U otodock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            proxy/requirements.txt
            proxy/requirements-test.txt
            audio/pyproject.toml

      - name: System tools used by the suite
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap passt iproute2 ripgrep
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install proxy dependencies
        run: |
          python -m pip install -U pip
          python -m pip install "./audio[localmodels]"
          python -m pip install -r proxy/requirements.txt -r proxy/requirements-test.txt

      - name: pytest
        working-directory: proxy
        env:
          TEST_DATABASE_URL: postgresql://otodock:otodock@localhost:5432/otodock_test
        run: python -m pytest -n 4 -q

      - name: pytest (audio package)
        working-directory: audio
        run: python -m pytest -q

  # The satellite's suite in the satellite's own environment: its lockfile
  # (what a paired machine installs) plus the test tools. Run from the repo
  # root so the `satellite` package imports as it does on a paired machine.
  satellite:
    if: github.repository == 'OtoDock/oto-dock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            satellite/requirements.txt
            proxy/requirements-test.txt

      - name: Codex CLI at the VERSIONS.md pin
        # Two session tests start a Codex session for real to check the
        # files it writes, so the daemon must be on PATH, at the version the
        # platform ships, installed as the installers do (npm 12 skips a
        # package's install scripts unless --allow-scripts names it).
        run: sudo npm install -g --allow-scripts=@openai/codex "@openai/codex@$(bash scripts/versions.sh CODEX_VERSION)"

      - name: Install satellite dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r satellite/requirements.txt -r proxy/requirements-test.txt

      - name: pytest
        run: python -m pytest satellite/tests -q

  # The same suite at the host floor (VERSIONS.md PYTHON_MIN_VERSION): what an
  # Ubuntu 22.04 host pairs with. A separate job, not a matrix, so the
  # `satellite` check keeps its name. The satellite's own requirements carry
  # tomli below 3.11 (the daemon validates a composed config.toml with it).
  satellite-floor:
    if: github.repository == 'OtoDock/oto-dock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            satellite/requirements.txt
            proxy/requirements-test.txt

      - name: Codex CLI at the VERSIONS.md pin
        run: sudo npm install -g --allow-scripts=@openai/codex "@openai/codex@$(bash scripts/versions.sh CODEX_VERSION)"

      - name: Install satellite dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r satellite/requirements.txt -r proxy/requirements-test.txt

      - name: pytest
        run: python -m pytest satellite/tests -q

  # The phone service's suite in the phone service's own environment: its
  # lockfile, then the audio package with the localmodels extra, in the
  # order the phone image installs them (the lockfile excludes the local
  # package). cwd = repo root so `./audio` resolves.
  phone:
    if: github.repository == 'OtoDock/oto-dock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            phone/requirements.txt
            proxy/requirements-test.txt
            audio/pyproject.toml

      - name: Install phone dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r phone/requirements.txt -r proxy/requirements-test.txt
          python -m pip install "./audio[localmodels]"

      - name: pytest
        working-directory: phone
        run: python -m pytest -q

  dashboard:
    if: github.repository == 'OtoDock/oto-dock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: npm ci
        working-directory: dashboard
        run: npm ci --no-audit --no-fund

      - name: typecheck
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: build
        working-directory: dashboard
        run: npm run build

      - name: vitest
        working-directory: dashboard
        run: npx vitest run

  # ESLint on the dashboard: every rule an error, the findings the code had
  # when the gate was adopted frozen per file and rule in
  # dashboard/eslint-suppressions.json. This cut lacks a few files the
  # suppressions name, so an unused suppression passes here. Not a required
  # check.
  dashboard-lint:
    if: github.repository == 'OtoDock/oto-dock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: npm ci
        working-directory: dashboard
        run: npm ci --no-audit --no-fund

      - name: eslint
        working-directory: dashboard
        run: npm run lint -- --pass-on-unpruned-suppressions

  # mypy on the proxy's allowlist (proxy/mypy.ini `files`), with the proxy's
  # dependencies installed so their types are the ones a local run sees. Not
  # a required check.
  typecheck:
    if: github.repository == 'OtoDock/oto-dock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            proxy/requirements.txt
            proxy/requirements-test.txt
            audio/pyproject.toml

      - name: Install proxy dependencies
        run: |
          python -m pip install -U pip
          python -m pip install ./audio
          python -m pip install -r proxy/requirements.txt -r proxy/requirements-test.txt
          python -m pip install -q "mypy==2.4.0"

      - name: mypy
        working-directory: proxy
        run: mypy


  # Secrets in the tracked tree, the Dockerfiles, the workflows and the
  # licensing (REUSE.toml), each tool at a pinned version checked against its
  # published sha256, and ruff's whole policy. Not a required check.
  lint:
    if: github.repository == 'OtoDock/oto-dock'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      REUSE_VERSION: 6.2.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Tools at pinned versions
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$bin" gitleaks
          curl -fsSLo "$bin/hadolint" "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $bin/hadolint" | sha256sum -c -
          chmod +x "$bin/hadolint"
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"

      - name: gitleaks
        # The tracked tree, as the release gate scans it (never .git).
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
          gitleaks dir "$RUNNER_TEMP/tree" --no-banner --redact --exit-code 1 --config .gitleaks.toml

      - name: hadolint
        # Errors fail; warnings are printed (the gate's levels).
        run: hadolint --no-color --failure-threshold error proxy/Dockerfile phone/Dockerfile mcps/custom/*/Dockerfile

      - name: actionlint
        run: actionlint -no-color

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: reuse lint
        run: |
          python -m pip install -q "reuse==${REUSE_VERSION}"
          reuse lint

      - name: ruff
        # The whole ruff.toml policy with its frozen baseline
        # (ruff-baseline.toml): a new finding of any rule fails here.
        run: |
          python -m pip install -q "ruff==0.15.22"
          ruff check .

  # Known vulnerabilities in every pinned Python lockfile, judged as the
  # release gate judges them: one with a fixed release fails, one without a
  # fix yet is a warning. Not a required check.
  pip-audit:
    if: github.repository == 'OtoDock/oto-dock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: pip-audit
        run: |
          python -m pip install -q "pip-audit==2.10.1"
          python - proxy/requirements.txt phone/requirements.txt satellite/requirements.txt mcps/custom/*/requirements.txt <<'PY'
          import json, re, subprocess, sys, tempfile
          fixable = 0
          for path in sys.argv[1:]:
              pins = [re.sub(r"\s*\\$", "", ln.strip()) for ln in open(path, encoding="utf-8")
                      if re.match(r"^[A-Za-z0-9_.\-]+==", ln)]
              if not pins:
                  print(f"::error::{path}: no exact pins"); fixable += 1; continue
              with tempfile.NamedTemporaryFile("w", suffix=".txt", delete=False) as fh:
                  fh.write("\n".join(pins) + "\n")
              out = subprocess.run(["pip-audit", "-r", fh.name, "--no-deps", "--disable-pip", "--strict",
                                    "--format", "json", "--progress-spinner", "off"],
                                   capture_output=True, text=True)
              try:
                  deps = json.loads(out.stdout).get("dependencies", [])
              except ValueError:
                  print(f"::error::{path}: pip-audit failed: {out.stderr.strip()[-300:]}"); fixable += 1; continue
              for dep in deps:
                  for v in dep.get("vulns", []):
                      fixes = ",".join(v.get("fix_versions") or [])
                      line = f"{path}: {dep['name']}=={dep['version']} {v['id']} fix={fixes or '-'}"
                      if fixes:
                          fixable += 1
                          print(f"::error::{line}")
                      else:
                          print(f"::warning::{line} (no fixed release yet)")
              print(f"{path}: {len(pins)} pins audited")
          sys.exit(1 if fixable else 0)
          PY

  # A pull request that adds a dependency with a known high or critical
  # vulnerability is flagged, the severity the release gate fails on. Not a
  # required check.
  dependency-review:
    if: github.repository == 'OtoDock/oto-dock' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
