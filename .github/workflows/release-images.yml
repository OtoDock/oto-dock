name: release-images

# Build the platform images and push them to GHCR. Self-hosted installs on the
# Docker-Compose topology PULL these tags (docker-compose.yml pins
# ghcr.io/otodock/otodock-proxy + otodock-file-tools at OTODOCK_VERSION);
# contributors build from source via docker-compose.build.yml instead.
#
# The version tag is read from VERSIONS.md (OTODOCK_VERSION) — the single
# source of truth — so bumping it there is what drives a new release tag.
# Triggers: pushing a release tag (v*), pushing an rc branch, or a manual
# dispatch on main. The ref decides the image tags (merge job):
#   tag v<X>            → <X> and latest; the tag must equal OTODOCK_VERSION
#   branch rc/<X>-rcN   → <X>-rcN only (a rehearsal of this pipeline before
#                         the tag, driven by the maintainers' release tooling;
#                         no compose file points at an rc tag)
#   dispatch on main    → <X> and latest, as a tag push would; a dispatch
#                         from any other branch is refused. Its attestation
#                         names refs/heads/main, which the verify SECURITY.md
#                         documents (refs/tags/v<X>) does not accept: to
#                         republish a release, re-run the tag's own workflow
#                         run instead.
#
# TRUST: every leg builds with an SBOM and full (mode=max) provenance in the
# image; the `boot` job starts the digest-addressed images of each
# architecture (scripts/image-boot-check.sh) and the merge, the only job that
# writes a tag, waits for it, so an image that does not start never gets a
# version tag. The `attest` job then signs a build provenance attestation for
# each tagged manifest list (the digest `docker pull <image>:<tag>` resolves),
# pushed beside it in the registry: `gh attestation verify
# oci://ghcr.io/otodock/<image>:<version> --repo OtoDock/oto-dock` checks it
# (SECURITY.md). Only that job holds the OIDC token.
#
# ARCHITECTURES: every image publishes linux/amd64 AND linux/arm64 as a
# manifest list, so `docker pull ghcr.io/otodock/<image>:<version>` resolves per
# host with no compose change. Each platform builds on a NATIVE runner and is
# pushed by digest; the `merge` job assembles the manifest list, applies the
# tags and fails the run when the list lacks either architecture (a merge
# only runs once both legs pushed, so the check is the record, not the gate;
# the release tooling checks the pull again before it calls the release done).
#
# FIRST-RUN, ONE-TIME (per package): after the first successful push, open
# Packages → <package> → Package settings and (a) set visibility to Public and
# (b) link it to this repository. GHCR packages default to private + unlinked.
# Auth uses the built-in GITHUB_TOKEN (packages: write) — no PAT required.

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']
    branches: ['rc/**']

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Images publish only from the official repo (never mirrors or forks).
    if: github.repository == 'OtoDock/oto-dock'
    # Native runner per platform — arm64 under QEMU would emulate `npm ci` and
    # the LibreOffice/model layers, which is too slow for a 6-leg matrix.
    # ubuntu-24.04-arm is a GitHub-hosted arm64 runner (free for public repos).
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        image: [otodock-proxy, otodock-file-tools, otodock-phone]
        platform: [linux/amd64, linux/arm64]
        include:
          # Merged into the combinations above (matching `image` key), so each
          # image keeps its build context without duplicating the platform axis.
          - image: otodock-proxy
            context: .
            dockerfile: proxy/Dockerfile
          - image: otodock-file-tools
            context: mcps/custom/file-tools-mcp
            dockerfile: mcps/custom/file-tools-mcp/Dockerfile
          - image: otodock-phone
            context: .
            dockerfile: phone/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sanitise the platform for use in file/tag names
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Resolve pinned versions from VERSIONS.md
        id: meta
        run: |
          version=$(bash scripts/versions.sh OTODOCK_VERSION)
          python_image=$(bash scripts/versions.sh PYTHON_IMAGE)
          node_image=$(bash scripts/versions.sh NODE_IMAGE)
          for v in version python_image node_image; do
            if [ -z "${!v}" ]; then
              echo "::error::${v} missing from VERSIONS.md"; exit 1
            fi
          done
          {
            echo "version=$version"
            echo "python_image=$python_image"
            echo "node_image=$node_image"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::building ${{ matrix.image }} (${{ matrix.platform }}) -> ghcr.io/otodock/${{ matrix.image }}:$version"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          # No `tags` here: each leg pushes an untagged, digest-addressed image
          # and the merge job below tags the assembled manifest list.
          outputs: type=image,name=ghcr.io/otodock/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # The SBOM and the provenance travel inside the image index as
          # attestation manifests (os "unknown"); the merge keeps them.
          sbom: true
          provenance: mode=max
          # file-tools takes PYTHON_IMAGE only; NODE_IMAGE is inert there.
          # OTODOCK_VERSION fills the org.opencontainers.image.version label.
          build-args: |
            PYTHON_IMAGE=${{ steps.meta.outputs.python_image }}
            NODE_IMAGE=${{ steps.meta.outputs.node_image }}
            OTODOCK_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          # Registry cache, keyed per image AND platform. GHCR has no size cap,
          # unlike the 10 GB/repo GitHub Actions cache these images would thrash
          # (the proxy layer set alone is ~3.7 GB uncompressed).
          cache-from: type=registry,ref=ghcr.io/otodock/${{ matrix.image }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=ghcr.io/otodock/${{ matrix.image }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max

      - name: Export the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  boot:
    # Start the images each platform built, by digest, before any tag exists:
    # a Postgres, the proxy until /health answers (its first boot builds the
    # bundled MCP venvs), the phone service against that proxy, the file tools
    # (scripts/image-boot-check.sh). Each architecture boots on its own native
    # runner, as it was built.
    if: github.repository == 'OtoDock/oto-dock'
    needs: [build]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sanitise the platform for use in file names
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      # The pattern matches every image's artifact, so each lands in its own
      # folder, which `ref` below lists. download-artifact extracts a LONE
      # match into the path itself: a matrix of one image needs a `name:`.
      - name: Download this platform's digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ env.PLATFORM_PAIR }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the images
        env:
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          ref() {
            local d
            d="$(ls "$DIGESTS/digests-$1-$PLATFORM_PAIR")"
            echo "ghcr.io/otodock/$1@sha256:$d"
          }
          bash scripts/image-boot-check.sh "$(ref otodock-proxy)" "$(ref otodock-file-tools)" "$(ref otodock-phone)"

  merge:
    # Assemble one manifest list per image from the per-platform digests and
    # apply the release tags. A failed build leg or boot skips this job (no
    # `if: always()`), so a half-built or unbootable release never gets a tag.
    if: github.repository == 'OtoDock/oto-dock'
    needs: [build, boot]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [otodock-proxy, otodock-file-tools, otodock-phone]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download this image's digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Resolve the image tags for this ref
        id: meta
        # The ref decides the tags (see the header). Both the tag and the rc
        # branch must name the version VERSIONS.md carries, so a forgotten
        # bump fails here, before any tag moves.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(bash scripts/versions.sh OTODOCK_VERSION)
          if [ -z "$version" ]; then
            echo "::error::OTODOCK_VERSION missing from VERSIONS.md"; exit 1
          fi
          case "$REF_TYPE/$REF_NAME" in
            tag/v*)
              if [ "${REF_NAME#v}" != "$version" ]; then
                echo "::error::tag $REF_NAME does not match OTODOCK_VERSION=$version"; exit 1
              fi
              tags="$version latest" ;;
            branch/rc/*)
              rc="${REF_NAME#rc/}"
              case "$rc" in
                "$version"-rc[0-9]*) ;;
                *) echo "::error::branch $REF_NAME does not match OTODOCK_VERSION=$version (expected rc/$version-rcN)"; exit 1 ;;
              esac
              tags="$rc" ;;
            branch/main)
              tags="$version latest" ;;
            *)
              echo "::error::$REF_TYPE $REF_NAME: images publish from a v* tag, an rc/* branch or a dispatch on main"; exit 1 ;;
          esac
          {
            echo "tags=$tags"
            echo "primary=${tags%% *}"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::${{ matrix.image }} → $tags"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create the manifest list and tag it
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image=ghcr.io/otodock/${{ matrix.image }}
          # The digests directory holds one empty file per platform, named by
          # the digest the build leg pushed.
          refs=()
          for d in *; do refs+=("${image}@sha256:${d}"); done
          tag_args=()
          for t in $TAGS; do tag_args+=(-t "${image}:${t}"); done
          docker buildx imagetools create "${tag_args[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.licenses=FSL-1.1-ALv2" \
            --annotation "index:org.opencontainers.image.description=OtoDock ${{ matrix.image }}, linux/amd64 and linux/arm64" \
            "${refs[@]}"

      - name: Verify both architectures
        # The list also carries buildx's provenance attestations (os "unknown"),
        # which do not count as an architecture.
        run: |
          image="ghcr.io/otodock/${{ matrix.image }}:${{ steps.meta.outputs.primary }}"
          docker buildx imagetools inspect "$image"
          docker buildx imagetools inspect --raw "$image" \
            | jq -e '[.manifests[]?.platform | select(.os != "unknown") | "\(.os)/\(.architecture)"]
                     | index("linux/amd64") != null and index("linux/arm64") != null' >/dev/null \
            || { echo "::error::$image lacks linux/amd64 or linux/arm64"; exit 1; }

      - name: Record the manifest list's digest
        # The digest a pull of the tag resolves: the index, never a platform
        # manifest. The attestation is made for this one.
        run: |
          mkdir -p "${{ runner.temp }}/list"
          docker buildx imagetools inspect "ghcr.io/otodock/${{ matrix.image }}:${{ steps.meta.outputs.primary }}" \
            --format '{{json .Manifest}}' | jq -r .digest > "${{ runner.temp }}/list/${{ matrix.image }}"
          grep -qE '^sha256:[0-9a-f]{64}$' "${{ runner.temp }}/list/${{ matrix.image }}"

      - name: Upload the list digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: list-${{ matrix.image }}
          path: ${{ runner.temp }}/list/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 1

  attest:
    # A build provenance attestation per manifest list, signed with this
    # workflow's OIDC identity and pushed to the registry beside the image.
    if: github.repository == 'OtoDock/oto-dock'
    needs: [merge]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [otodock-proxy, otodock-file-tools, otodock-phone]
    steps:
      - name: Download the list digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: list-${{ matrix.image }}
          path: ${{ runner.temp }}/list

      - name: Read the digest
        id: list
        run: echo "digest=$(cat "${{ runner.temp }}/list/${{ matrix.image }}")" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/otodock/${{ matrix.image }}
          subject-digest: ${{ steps.list.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
