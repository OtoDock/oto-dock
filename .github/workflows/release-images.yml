name: release-images

# Build the platform images and push them to GHCR. Self-hosted installs on the
# Docker-Compose topology PULL these tags (docker-compose.yml pins
# ghcr.io/otodock/otodock-proxy + otodock-file-tools at OTODOCK_VERSION);
# contributors build from source via docker-compose.build.yml instead.
#
# The version tag is read from VERSIONS.md (OTODOCK_VERSION) — the single
# source of truth — so bumping it there is what drives a new release tag.
# Triggers: pushing a release tag (v*), pushing an rc branch, or a manual
# dispatch on main. The ref decides the image tags (merge job):
#   tag v<X>            → <X> and latest; the tag must equal OTODOCK_VERSION
#   branch rc/<X>-rcN   → <X>-rcN only (a rehearsal of this pipeline before
#                         the tag, driven by the maintainers' release tooling;
#                         no compose file points at an rc tag)
#   dispatch on main    → <X> and latest, as a tag push would
#
# ARCHITECTURES: every image publishes linux/amd64 AND linux/arm64 as a
# manifest list, so `docker pull ghcr.io/otodock/<image>:<version>` resolves per
# host with no compose change. Each platform builds on a NATIVE runner and is
# pushed by digest; the `merge` job assembles the manifest list, applies the
# tags and fails the run when the list lacks either architecture (a merge
# only runs once both legs pushed, so the check is the record, not the gate;
# the release tooling checks the pull again before it calls the release done).
#
# FIRST-RUN, ONE-TIME (per package): after the first successful push, open
# Packages → <package> → Package settings and (a) set visibility to Public and
# (b) link it to this repository. GHCR packages default to private + unlinked.
# Auth uses the built-in GITHUB_TOKEN (packages: write) — no PAT required.

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']
    branches: ['rc/**']

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Images publish only from the official repo (never mirrors or forks).
    if: github.repository == 'OtoDock/oto-dock'
    # Native runner per platform — arm64 under QEMU would emulate `npm ci` and
    # the LibreOffice/model layers, which is too slow for a 6-leg matrix.
    # ubuntu-24.04-arm is a GitHub-hosted arm64 runner (free for public repos).
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        image: [otodock-proxy, otodock-file-tools, otodock-phone]
        platform: [linux/amd64, linux/arm64]
        include:
          # Merged into the combinations above (matching `image` key), so each
          # image keeps its build context without duplicating the platform axis.
          - image: otodock-proxy
            context: .
            dockerfile: proxy/Dockerfile
          - image: otodock-file-tools
            context: mcps/custom/file-tools-mcp
            dockerfile: mcps/custom/file-tools-mcp/Dockerfile
          - image: otodock-phone
            context: .
            dockerfile: phone/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Sanitise the platform for use in file/tag names
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Resolve pinned versions from VERSIONS.md
        id: meta
        run: |
          version=$(bash scripts/versions.sh OTODOCK_VERSION)
          python_image=$(bash scripts/versions.sh PYTHON_IMAGE)
          node_image=$(bash scripts/versions.sh NODE_IMAGE)
          for v in version python_image node_image; do
            if [ -z "${!v}" ]; then
              echo "::error::${v} missing from VERSIONS.md"; exit 1
            fi
          done
          {
            echo "version=$version"
            echo "python_image=$python_image"
            echo "node_image=$node_image"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::building ${{ matrix.image }} (${{ matrix.platform }}) -> ghcr.io/otodock/${{ matrix.image }}:$version"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          # No `tags` here: each leg pushes an untagged, digest-addressed image
          # and the merge job below tags the assembled manifest list.
          outputs: type=image,name=ghcr.io/otodock/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # file-tools has no version ARGs — the extra build-args are inert there.
          build-args: |
            PYTHON_IMAGE=${{ steps.meta.outputs.python_image }}
            NODE_IMAGE=${{ steps.meta.outputs.node_image }}
          # Registry cache, keyed per image AND platform. GHCR has no size cap,
          # unlike the 10 GB/repo GitHub Actions cache these images would thrash
          # (the proxy layer set alone is ~3.7 GB uncompressed).
          cache-from: type=registry,ref=ghcr.io/otodock/${{ matrix.image }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=ghcr.io/otodock/${{ matrix.image }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max

      - name: Export the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Assemble one manifest list per image from the per-platform digests and
    # apply the release tags. A failed build leg skips this job (no
    # `if: always()`), so a half-built release never gets a tag.
    if: github.repository == 'OtoDock/oto-dock'
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [otodock-proxy, otodock-file-tools, otodock-phone]
    steps:
      - uses: actions/checkout@v4

      - name: Download this image's digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Resolve the image tags for this ref
        id: meta
        # The ref decides the tags (see the header). Both the tag and the rc
        # branch must name the version VERSIONS.md carries, so a forgotten
        # bump fails here, before any tag moves.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(bash scripts/versions.sh OTODOCK_VERSION)
          if [ -z "$version" ]; then
            echo "::error::OTODOCK_VERSION missing from VERSIONS.md"; exit 1
          fi
          case "$REF_TYPE/$REF_NAME" in
            tag/v*)
              if [ "${REF_NAME#v}" != "$version" ]; then
                echo "::error::tag $REF_NAME does not match OTODOCK_VERSION=$version"; exit 1
              fi
              tags="$version latest" ;;
            branch/rc/*)
              rc="${REF_NAME#rc/}"
              case "$rc" in
                "$version"-rc[0-9]*) ;;
                *) echo "::error::branch $REF_NAME does not match OTODOCK_VERSION=$version (expected rc/$version-rcN)"; exit 1 ;;
              esac
              tags="$rc" ;;
            *)
              tags="$version latest" ;;
          esac
          {
            echo "tags=$tags"
            echo "primary=${tags%% *}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::${{ matrix.image }} → $tags"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create the manifest list and tag it
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image=ghcr.io/otodock/${{ matrix.image }}
          # The digests directory holds one empty file per platform, named by
          # the digest the build leg pushed.
          refs=()
          for d in *; do refs+=("${image}@sha256:${d}"); done
          tag_args=()
          for t in $TAGS; do tag_args+=(-t "${image}:${t}"); done
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

      - name: Verify both architectures
        # The list also carries buildx's provenance attestations (os "unknown"),
        # which do not count as an architecture.
        run: |
          image="ghcr.io/otodock/${{ matrix.image }}:${{ steps.meta.outputs.primary }}"
          docker buildx imagetools inspect "$image"
          docker buildx imagetools inspect --raw "$image" \
            | jq -e '[.manifests[]?.platform | select(.os != "unknown") | "\(.os)/\(.architecture)"]
                     | index("linux/amd64") != null and index("linux/arm64") != null' >/dev/null \
            || { echo "::error::$image lacks linux/amd64 or linux/arm64"; exit 1; }
