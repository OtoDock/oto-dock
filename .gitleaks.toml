# Gitleaks config for this repository's CI (the `lint` job of ci.yml):
# default rules + the platform's own key format + a tight allowlist for
# known-benign fixtures. Keep this list SHORT and exact: every entry here is
# something a human verified is not a secret. The maintainers' release gate
# scans with the same rules.
[extend]
useDefault = true

# The platform's own agent/user API keys (the gate webhook key travels in
# an environment variable on the dev box, never in a file).
[[rules]]
id = "otodock-api-key"
description = "OtoDock agent or user API key"
regex = '''otok_[A-Za-z0-9_-]{32,}'''

[allowlist]
description = "Verified-benign placeholders and test fixtures"
regexTarget = "match"
regexes = [
    # phone_adapters/base.py — a curl TEMPLATE with a literal placeholder
    # token (__REGISTER_SECRET__ is substituted at provisioning time).
    '''__REGISTER_SECRET__''',
    # tests/auth/test_webhook_providers.py — MS Graph validation-handshake
    # fixture value.
    '''validationToken": "abc-123-opaque"''',
    # tests/tasks/test_task_identity_authority.py — TaskIdentity fixture
    # exercising the is_api_key flag with the literal string "api-key".
    '''api-key", is_api_key=True''',
    # dashboard/src/tests/browserModeControls.test.tsx — the own-browser
    # extension-token field exercised with an obviously synthetic value.
    '''tok-123456789012345''',
    # proxy/tests/fixtures/characterization/claude-*.jsonl — the Anthropic
    # message ids the CLI prints in its recorded frames (identifiers, not
    # keys; the recordings' real tokens were scrubbed before they were kept).
    '''api_message_id": "msg_01[A-Za-z0-9]{22}(?:"|$)''',
    # A test fixture's project rows: a slug whose words look like a secret's
    # name, followed by the row's id (a UUID, not a key).
    '''(?:credential-broker-1-7-2|oauth-verification)', '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''',
]
